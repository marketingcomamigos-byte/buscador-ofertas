<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OFERTAS+ — Conectar extensão</title><style>body{font-family:Arial,sans-serif;background:#f7f8fc;margin:0;padding:40px;color:#171923}.wrap{max-width:620px;margin:auto;background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:28px}.logo{font-size:30px;font-weight:900;color:#6c35ff}button{margin-top:16px;padding:12px 18px;border:0;border-radius:10px;background:#6c35ff;color:#fff;font-weight:800;cursor:pointer}.muted{color:#667085;line-height:1.6;font-size:14px}.ok{color:#087f5b}.err{color:#b42318}</style></head><body><div class="wrap"><div class="logo">OFERTAS+</div><h2>Conectar extensão Mercado Livre</h2><p id="msg" class="muted">Verificando sua sessão administrativa...</p><button id="login" style="display:none">Abrir painel administrativo</button></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://kpvunszwaqykxrefuktp.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzg5NzI0MjAxLCJleHAiOjIxMDUzMDAyMH0.Al3Mz1uQ855tHzOdjN6UAvNCqTy5eLkjHJQum77KwoA';
const sb=window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
(async()=>{const msg=document.getElementById('msg'); const login=document.getElementById('login'); const {data:{session}}=await sb.auth.getSession(); if(!session){msg.textContent='Abra o painel administrativo, faça login e depois volte/abra esta página novamente.'; login.style.display='inline-block'; login.onclick=()=>location.href='/admin.html'; return;} const r=await fetch('/api/mercadolivre-extension-connect',{method:'POST',headers:{Authorization:`Bearer ${session.access_token}`,'Content-Type':'application/json'},body:'{}'}); const data=await r.json().catch(()=>({})); if(!r.ok||!data.token){msg.className='err'; msg.textContent=data.error||'Não foi possível conectar a extensão.'; return;} window.postMessage({type:'OFERTAS_PLUS_EXTENSION_TOKEN',token:data.token,expiresAt:data.expiresAt},'*'); msg.className='ok'; msg.textContent='✅ Extensão conectada com sucesso. Você já pode voltar ao Mercado Livre e importar produtos sem preencher tokens.';})();
</script></body></html>
