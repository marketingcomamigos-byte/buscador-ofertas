<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{font-family:Inter,Arial,sans-serif;width:395px;margin:0;padding:16px;background:#f8fafc;color:#172033}.head{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{color:#642cff;font-size:23px;font-weight:900}.sub{color:#64748b;font-size:12px;margin:2px 0 14px}.box{border:1px solid #e2e8f0;border-radius:15px;padding:13px;background:#fff;margin-bottom:10px}.label{font-size:11px;font-weight:900;text-transform:uppercase;color:#64748b;margin-bottom:5px}.name{font-weight:850;line-height:1.27;margin-bottom:7px}.muted{color:#64748b;font-size:12px;line-height:1.45}.ok{color:#087f5b}.err{color:#b42318}.warn{color:#8a5b00}.btn{width:100%;border:0;border-radius:12px;padding:12px;font-weight:850;cursor:pointer;margin-top:8px}.primary{background:#ff9900;color:#111}.secondary{background:#eef2f7;color:#172033}.status{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:800;margin-top:9px}.dot{width:9px;height:9px;border-radius:999px;background:#cbd5e1}.dot.ok{background:#18a572}.dot.warn{background:#f0aa00}.small{font-size:11px;color:#64748b;margin-top:7px}.linkbox{width:100%;margin-top:9px;border:1px solid #d7dee8;border-radius:9px;padding:8px 9px;font-size:11px;color:#334155;background:#f8fafc}
</style></head><body>
<div class="head"><div><div class="brand">OFERTAS+</div><div class="sub">Importador Amazon</div></div><div id="version" class="small">V5.1</div></div>
<div id="content" class="box">Carregando...</div>
<div class="box"><div class="label">Conexão</div><div id="connection" class="status"><span class="dot"></span><span>Verificando…</span></div><div id="connectionInfo" class="small"></div></div>
<button id="connect" class="btn primary">🔐 Conectar ao OFERTAS+</button>
<button id="importNow" class="btn primary">⚡ Ler link copiado e importar agora</button>
<button id="help" class="btn secondary">Como gerar meu link Amazon</button>
<script src="popup.js"></script></body></html>
